<!doctype html><html lang="ja"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>鹿乃宿（しかのやど）｜奈良公園、鹿に出会う旅</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/><style>:root{
    --sumi:#1a1816;       /* 墨 */
    --sumi-2:#2a2622;
    --kinari:#f4efe6;     /* 生成り */
    --kinari-2:#ebe3d3;
    --washi:#ede4d1;      /* 和紙 */
    --aka:#a8443a;        /* 朱 */
    --aka-deep:#7e2e26;
    --kincha:#b08947;     /* 金茶 */
    --koke:#5a6b3a;       /* 苔 */
    --line:rgba(26,24,22,.16);
    --line-soft:rgba(26,24,22,.08);
    --serif:"Shippori Mincho B1", "Noto Serif JP", "Hiragino Mincho ProN", serif;
    --serif-body:"Noto Serif JP", "Hiragino Mincho ProN", serif;
    --sans:"Noto Sans JP", system-ui, sans-serif;
    --mono:"JetBrains Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{scroll-padding-top:72px}
  body{
    background:var(--kinari);
    color:var(--sumi);
    font-family:var(--serif-body);
    font-weight:400;
    line-height:1.85;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  img{max-width:100%;display:block}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;color:inherit}

  /* Reusable */
  .wrap{max-width:1180px;margin:0 auto;padding:0 32px}
  .wrap-narrow{max-width:880px;margin:0 auto;padding:0 32px}

  .h-display{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(28px, 4vw, 52px);
    letter-spacing:.04em;
    line-height:1.35;
    margin:0;
  }
  .h-section{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(26px, 3.4vw, 42px);
    letter-spacing:.06em;
    line-height:1.4;
    margin:0;
  }
  .body-lg{font-size:16px;line-height:2;color:var(--sumi-2)}
  .body{font-size:15px;line-height:2;color:var(--sumi-2)}
  .body-sm{font-size:13px;line-height:1.9;color:var(--sumi-2)}

  /* Vertical kanji accent */
  .vtext{
    writing-mode:vertical-rl;
    font-family:var(--serif);
    letter-spacing:.4em;
    line-height:1.6;
  }

  /* Placeholder image */
  .ph{
    position:relative;
    overflow:hidden;
    background:
      repeating-linear-gradient(135deg,
        rgba(26,24,22,.05) 0 14px,
        rgba(26,24,22,.09) 14px 15px);
    background-color:var(--kinari-2);
    color:var(--sumi);
    display:flex;align-items:flex-end;
    isolation:isolate;
  }
  .ph::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, transparent 55%, rgba(26,24,22,.08));
    pointer-events:none;
  }
  .ph__tag{
    position:relative;z-index:1;
    margin:14px;
    padding:6px 10px;
    background:rgba(244,239,230,.92);
    border:1px solid var(--line);
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.06em;
    color:var(--sumi);
  }
  .ph--dark{background-color:#221f1c}
  .ph--dark::before{
    content:"";position:absolute;inset:0;
    background:
      repeating-linear-gradient(135deg,
        rgba(244,239,230,.06) 0 14px,
        rgba(244,239,230,.10) 14px 15px);
  }
  .ph--dark .ph__tag{background:rgba(26,24,22,.78);color:var(--kinari);border-color:rgba(244,239,230,.18)}

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;gap:14px;
    padding:18px 28px;
    background:var(--sumi);
    color:var(--kinari);
    font-family:var(--serif);
    font-weight:500;
    letter-spacing:.16em;
    font-size:14px;
    border:1px solid var(--sumi);
    transition:background .2s ease, color .2s ease;
  }
  .btn:hover{background:var(--aka);border-color:var(--aka)}
  .btn--aka{background:var(--aka);border-color:var(--aka)}
  .btn--aka:hover{background:var(--aka-deep);border-color:var(--aka-deep)}
  .btn--ghost{background:transparent;color:var(--sumi)}
  .btn--ghost:hover{background:var(--sumi);color:var(--kinari)}
  .btn__arrow{font-family:var(--mono);font-weight:400}

  /* Generic numbered marker */
  .num{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.2em;
    color:var(--aka);
  }

  /* Sections */
  section{padding:120px 0;position:relative}
  section.tight{padding:96px 0}
  .section-head{display:grid;grid-template-columns:200px 1fr;gap:48px;align-items:start;margin-bottom:56px}
  .section-head__meta .num{display:block;margin-bottom:18px}
  .section-head__title{max-width:760px}
  @media (max-width:760px){
    .section-head{grid-template-columns:1fr;gap:18px;margin-bottom:36px}
    section{padding:88px 0}
  }

  /* Responsive layout refinements */
  @media (max-width:1080px){
    .wrap{max-width:960px;padding:0 28px}
    .wrap-narrow{padding:0 28px}
    .nav__links{gap:18px}
    .hero-facts{grid-template-columns:repeat(2, minmax(0, 1fr)) !important;gap:18px !important}
    .voice-stats{grid-template-columns:repeat(2, minmax(0, 1fr)) !important}
    .press-grid{grid-template-columns:repeat(3, minmax(0, 1fr)) !important}
    .footer-grid{grid-template-columns:1fr 1fr !important}
  }

  .hero-facts-mobile-band{display:none}

  @media (max-width:860px){
    html{scroll-padding-top:64px}
    section{padding:88px 0}
    .wrap,.wrap-narrow{padding:0 24px}
    .section-head__meta .vtext{display:none}
    .problem-grid,
    .solution-grid,
    .room-feature,
    .room-card-grid,
    .cuisine-block,
    .onsen-block,
    .strengths-grid,
    .voice-reviews,
    .reserve-contact{grid-template-columns:1fr !important}
    .problem-card{border-right:none !important;border-bottom:1px solid var(--line)}
    .problem-card:last-child{border-bottom:none}
    .empathy-grid{grid-template-columns:1fr !important;gap:48px !important}
    .empathy-photo-badge{left:20px !important;bottom:-20px !important;width:180px !important}
    .room-feature,
    .cuisine-block,
    .onsen-block{gap:32px !important;margin-bottom:72px !important}
    .room-specs{grid-template-columns:1fr !important}
    .flow-row{grid-template-columns:64px 1fr !important;gap:20px !important;padding:28px 0 !important}
    .flow-time{display:none}
    .booking-panel{padding:32px 24px !important}
    .booking-steps{overflow-x:auto;scrollbar-width:none}
    .booking-steps::-webkit-scrollbar{display:none}
    .booking-steps__item{flex:0 0 132px !important}
    .booking-date-grid,
    .booking-room-grid,
    .booking-field-row{grid-template-columns:1fr !important}
    .meal-option{grid-template-columns:1fr !important}
    .booking-confirm-row{grid-template-columns:1fr !important;gap:4px !important}
    .booking-total{display:grid !important;gap:8px;text-align:left}
  }

  @media (max-width:640px){
    .wrap,.wrap-narrow{padding:0 18px}
    section{padding:72px 0}
    .h-section{font-size:clamp(24px, 7vw, 32px);letter-spacing:.04em}
    .body-lg{font-size:15px;line-height:1.9}
    .body{font-size:14px;line-height:1.9}
    .body-sm{font-size:12.5px;line-height:1.85}
    .btn{width:100%;justify-content:center;padding:14px 16px;font-size:13px;letter-spacing:.1em}
    .nav{padding:14px 16px}
    .nav__brand{gap:10px;font-size:14px;letter-spacing:.14em}
    .nav__brand .crest{width:28px;height:28px}
    .nav__cta{padding:9px 14px;letter-spacing:.14em}
    header{min-height:100svh !important;padding-top:62px !important}
    header > .vtext{display:none}
    header .wrap{min-height:calc(100svh - 62px) !important;padding-top:48px !important;padding-bottom:32px !important}
    header .h-display{font-size:clamp(32px, 8.6vw, 44px) !important;letter-spacing:.02em !important;line-height:1.34 !important}
    header .h-display span{font-size:.52em !important;letter-spacing:.18em !important;margin-bottom:14px !important}
    header .body-lg{font-size:15px !important;margin-bottom:32px !important}
    .hero-facts{grid-template-columns:repeat(2, minmax(0, 1fr)) !important;font-size:10px !important;letter-spacing:.1em !important;gap:14px !important;padding-top:18px !important}
    .hero-facts--in-hero{display:none !important}
    .hero-facts-mobile-band{
      display:block;
      background:var(--sumi);
      padding:0 0 30px;
      color:var(--kinari);
    }
    .hero-facts--after-hero{display:grid !important}
    .voice-stats,
    .press-grid,
    .footer-grid{grid-template-columns:1fr !important}
    .date-picker__popover{width:min(280px, calc(100vw - 36px)) !important}
    .room-option{padding:16px !important}
    .room-option__head{flex-direction:column;gap:4px;align-items:flex-start !important}
    .booking-actions{flex-direction:column-reverse;gap:12px !important}
    .booking-actions .btn{width:100%}
    .booking-modal{padding:16px 10px !important;align-items:flex-start !important}
    .booking-modal__panel{padding:48px 18px 24px !important}
    .sticky-reserve{left:16px !important;right:16px !important;bottom:16px !important;justify-content:center !important}
    #faq button[style*="40px 1fr 24px"]{grid-template-columns:32px 1fr 20px !important;gap:10px !important}
    #faq .fade div[style*="padding: 0 4px 28px 60px"]{padding-left:42px !important}
  }

  /* Dark section variant */
  .dark{background:var(--sumi);color:var(--kinari)}
  .dark .body, .dark .body-lg, .dark .body-sm{color:rgba(244,239,230,.78)}
  .dark .num{color:var(--kincha)}

  /* Top nav */
  .nav{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 32px;
    background:rgba(244,239,230,.86);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-soft);
  }
  .nav__brand{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-weight:600;letter-spacing:.2em;font-size:15px}
  .nav__brand .crest{
    width:30px;height:30px;border:1px solid var(--sumi);
    display:grid;place-items:center;
    font-size:14px;
  }
  .nav__links{display:flex;gap:28px;font-size:13px;letter-spacing:.16em;font-family:var(--serif)}
  .nav__links a{opacity:.78;transition:opacity .2s}
  .nav__links a:hover{opacity:1;color:var(--aka)}
  .nav__cta{
    padding:10px 18px;background:var(--aka);color:var(--kinari);
    font-size:12px;letter-spacing:.2em;font-family:var(--serif)
  }
  .nav__cta:hover{background:var(--aka-deep)}
  @media (max-width:860px){
    .nav__links{display:none}
  }

  /* Utility */
  .rule{height:1px;background:var(--line);width:100%}
  .vrule{width:1px;background:var(--line);align-self:stretch}

  /* fade-in entrance */
  .fade{opacity:0;transform:translateY(14px);transition:opacity .9s ease, transform .9s ease}
  .fade.in{opacity:1;transform:none}

  /* Mount loading */
  #root:empty::before{
    content:"鹿乃宿を読み込んでいます…";
    display:block;padding:140px 0;text-align:center;
    font-family:var(--serif);color:var(--sumi-2);letter-spacing:.2em
  }

  .mobile-only-break{display:none}

  @media (max-width:860px){
    .empathy-photo-badge{left:0 !important;width:180px !important}
  }

  @media (max-width:640px){
    .mobile-only-break{display:block}
    .nav{width:100vw !important;right:auto !important;padding:14px 16px}
    .nav__brand{gap:10px;font-size:14px;letter-spacing:.14em}
    .nav__brand .crest{width:28px;height:28px}
    .nav__cta{padding:9px 14px;letter-spacing:.14em}
    .h-display,.h-section,.body-lg,.body,.body-sm{overflow-wrap:anywhere;word-break:break-all;line-break:anywhere}
    header .wrap > div:first-child{max-width:100% !important}
    header p{max-width:100% !important}
    header .h-display{
      font-size:clamp(28px, 7.4vw, 34px) !important;
      letter-spacing:.01em !important;
      overflow-wrap:anywhere;
    }
    header .h-display span{letter-spacing:.16em !important}
    .empathy-photo-badge{
      left:0 !important;
      width:min(150px, calc(100vw - 36px)) !important;
      padding:18px !important;
    }
    .empathy-photo-badge > div{max-width:100% !important}
  }</style></head><body><div id="root"></div><script defer="defer" src="bundle.js"></script></body></html>
