<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>鹿乃宿（しかのやど）｜奈良公園、鹿に出会う旅</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root{
    --sumi:#1a1816;       /* 墨 */
    --sumi-2:#2a2622;
    --kinari:#f4efe6;     /* 生成り */
    --kinari-2:#ebe3d3;
    --washi:#ede4d1;      /* 和紙 */
    --aka:#a8443a;        /* 朱 */
    --aka-deep:#7e2e26;
    --kincha:#b08947;     /* 金茶 */
    --koke:#5a6b3a;       /* 苔 */
    --line:rgba(26,24,22,.16);
    --line-soft:rgba(26,24,22,.08);
    --serif:"Shippori Mincho B1", "Noto Serif JP", "Hiragino Mincho ProN", serif;
    --serif-body:"Noto Serif JP", "Hiragino Mincho ProN", serif;
    --sans:"Noto Sans JP", system-ui, sans-serif;
    --mono:"JetBrains Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--kinari);
    color:var(--sumi);
    font-family:var(--serif-body);
    font-weight:400;
    line-height:1.85;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  img{max-width:100%;display:block}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;color:inherit}

  /* Reusable */
  .wrap{max-width:1180px;margin:0 auto;padding:0 32px}
  .wrap-narrow{max-width:880px;margin:0 auto;padding:0 32px}

  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.25em;
    text-transform:uppercase;
    color:var(--aka);
    display:inline-flex;align-items:center;gap:14px;
  }
  .eyebrow::before{content:"";width:28px;height:1px;background:var(--aka)}

  .h-display{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(28px, 4vw, 52px);
    letter-spacing:.04em;
    line-height:1.35;
    margin:0;
  }
  .h-section{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(26px, 3.4vw, 42px);
    letter-spacing:.06em;
    line-height:1.4;
    margin:0;
  }
  .body-lg{font-size:16px;line-height:2;color:var(--sumi-2)}
  .body{font-size:15px;line-height:2;color:var(--sumi-2)}
  .body-sm{font-size:13px;line-height:1.9;color:var(--sumi-2)}

  /* Vertical kanji accent */
  .vtext{
    writing-mode:vertical-rl;
    font-family:var(--serif);
    letter-spacing:.4em;
    line-height:1.6;
  }

  /* Placeholder image */
  .ph{
    position:relative;
    overflow:hidden;
    background:
      repeating-linear-gradient(135deg,
        rgba(26,24,22,.05) 0 14px,
        rgba(26,24,22,.09) 14px 15px);
    background-color:var(--kinari-2);
    color:var(--sumi);
    display:flex;align-items:flex-end;
    isolation:isolate;
  }
  .ph::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, transparent 55%, rgba(26,24,22,.08));
    pointer-events:none;
  }
  .ph__tag{
    position:relative;z-index:1;
    margin:14px;
    padding:6px 10px;
    background:rgba(244,239,230,.92);
    border:1px solid var(--line);
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.06em;
    color:var(--sumi);
  }
  .ph--dark{background-color:#221f1c}
  .ph--dark::before{
    content:"";position:absolute;inset:0;
    background:
      repeating-linear-gradient(135deg,
        rgba(244,239,230,.06) 0 14px,
        rgba(244,239,230,.10) 14px 15px);
  }
  .ph--dark .ph__tag{background:rgba(26,24,22,.78);color:var(--kinari);border-color:rgba(244,239,230,.18)}

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;gap:14px;
    padding:18px 28px;
    background:var(--sumi);
    color:var(--kinari);
    font-family:var(--serif);
    font-weight:500;
    letter-spacing:.16em;
    font-size:14px;
    border:1px solid var(--sumi);
    transition:background .2s ease, color .2s ease;
  }
  .btn:hover{background:var(--aka);border-color:var(--aka)}
  .btn--aka{background:var(--aka);border-color:var(--aka)}
  .btn--aka:hover{background:var(--aka-deep);border-color:var(--aka-deep)}
  .btn--ghost{background:transparent;color:var(--sumi)}
  .btn--ghost:hover{background:var(--sumi);color:var(--kinari)}
  .btn__arrow{font-family:var(--mono);font-weight:400}

  /* Generic numbered marker */
  .num{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.2em;
    color:var(--aka);
  }

  /* Sections */
  section{padding:120px 0;position:relative}
  section.tight{padding:96px 0}
  .section-head{display:grid;grid-template-columns:200px 1fr;gap:48px;align-items:start;margin-bottom:56px}
  .section-head__meta .num{display:block;margin-bottom:18px}
  .section-head__title{max-width:760px}
  @media (max-width:760px){
    .section-head{grid-template-columns:1fr;gap:18px;margin-bottom:36px}
    section{padding:88px 0}
  }

  /* Dark section variant */
  .dark{background:var(--sumi);color:var(--kinari)}
  .dark .body, .dark .body-lg, .dark .body-sm{color:rgba(244,239,230,.78)}
  .dark .eyebrow{color:var(--kincha)}
  .dark .eyebrow::before{background:var(--kincha)}
  .dark .num{color:var(--kincha)}

  /* Top nav */
  .nav{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 32px;
    background:rgba(244,239,230,.86);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-soft);
  }
  .nav__brand{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-weight:600;letter-spacing:.2em;font-size:15px}
  .nav__brand .crest{
    width:30px;height:30px;border:1px solid var(--sumi);
    display:grid;place-items:center;
    font-size:14px;
  }
  .nav__links{display:flex;gap:28px;font-size:13px;letter-spacing:.16em;font-family:var(--serif)}
  .nav__links a{opacity:.78;transition:opacity .2s}
  .nav__links a:hover{opacity:1;color:var(--aka)}
  .nav__cta{
    padding:10px 18px;background:var(--aka);color:var(--kinari);
    font-size:12px;letter-spacing:.2em;font-family:var(--serif)
  }
  .nav__cta:hover{background:var(--aka-deep)}
  @media (max-width:860px){
    .nav__links{display:none}
  }

  /* Utility */
  .rule{height:1px;background:var(--line);width:100%}
  .vrule{width:1px;background:var(--line);align-self:stretch}

  /* fade-in entrance */
  .fade{opacity:0;transform:translateY(14px);transition:opacity .9s ease, transform .9s ease}
  .fade.in{opacity:1;transform:none}

  /* Mount loading */
  #root:empty::before{
    content:"鹿乃宿を読み込んでいます…";
    display:block;padding:140px 0;text-align:center;
    font-family:var(--serif);color:var(--sumi-2);letter-spacing:.2em
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script defer src="bundle.js"></script>
</body>
</html>
